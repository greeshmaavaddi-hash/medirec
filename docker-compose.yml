services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: medirec
      POSTGRES_PASSWORD: medirec
      POSTGRES_DB: medirec
    ports: ["5432:5432"]
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
  ml:
    build: ./ml-service
    ports: ["8000:8000"]
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgres://medirec:medirec@db:5432/medirec
      ML_URL: http://ml:8000
    ports: ["4000:4000"]
    depends_on: [db, ml]
